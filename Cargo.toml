[package]
name = "shazamrs"
version = "0.1.0"
edition = "2024"

[dependencies]
shazamrs-core = { path = "../shazamrs-core" }
reqwest = { version = "0.12", features = ["json", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros"] }
thiserror = "1.0"
uuid = { version = "1.19.0", features = ["v4"] }
rand = "0.9.2"
